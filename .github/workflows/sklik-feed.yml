name: Sklik feed CUSTOM_LABEL_1

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Transformace feedu
        env:
          NEVYKONNE_CSV_URL: ${{ secrets.NEVYKONNE_CSV_URL }}
          FEED_URL: https://www.luxusnipradlo.cz/publicdoc/shop_zbozicz.xml
          OUT_PATH: shop_zbozicz_sklik.xml
        run: python transform_feed.py

      - name: Komprese vystupu (feed je >2 GB, Release limit 2 GB)
        run: |
          gzip -f shop_zbozicz_sklik.xml
          ls -lh shop_zbozicz_sklik.xml.gz

      - name: Publikace feedu do GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create feed --title "Sklik feed" --notes "Upraveny Zbozi feed gzip" || true
          gh release upload feed shop_zbozicz_sklik.xml.gz --clobber
          echo "Stabilni URL feedu:"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/feed/shop_zbozicz_sklik.xml.gz"
